<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qmove & LKAB</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #f4f6f8; --card: #fff; --text: #1d2433; --muted: #6b7280;
    --primary: #2563eb; --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  .card {
    background: var(--card); border-radius: 12px; padding: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .desc {
    font-size: 13px; color: var(--muted); line-height: 1.6;
    background: #f8fafc; border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
  }
  .desc b { color: var(--text); }
  .blok { display: none; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  input {
    width: 100%; padding: 12px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 8px; background: #fff;
  }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .chips { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border); background: #fff; border-radius: 999px;
    padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  .chip.selected { background: var(--primary); color: #fff; border-color: var(--primary); }
  .submit {
    width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 10px;
    font-size: 16px; font-weight: 700; color: #fff; background: var(--primary); cursor: pointer;
  }
  .submit:disabled { opacity: .6; cursor: not-allowed; }
  .result {
    margin-top: 16px; padding: 14px; border-radius: 10px;
    font-size: 14px; line-height: 1.6; white-space: pre-wrap; display: none;
  }
  .result.ok   { display: block; background: #f0fdf4; border: 1px solid #bbf7d0; color: #14532d; }
  .result.warn { display: block; background: #fffbeb; border: 1px solid #fde68a; color: #78350f; }
  .result.err  { display: block; background: #fef2f2; border: 1px solid #fecaca; color: #7f1d1d; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="judul"></h1>

  <div class="card">
    <div class="desc" id="desc"></div>

    <!-- Top Up Qmove -->
    <div class="blok" id="blokTopup">
      <label>Nominal Top Up</label>
      <div class="chips" id="chipsNominal"></div>
    </div>

    <!-- Transfer LKAB -->
    <div class="blok" id="blokLkab">
      <label for="nominalLkab">Nominal Transfer (Rp)</label>
      <input type="text" id="nominalLkab" inputmode="numeric" placeholder="5.000.000" autocomplete="off">
      <div class="hint">Biaya admin Rp2.500 dicatat otomatis ke Beban Adm Bank.</div>

      <label for="txId">Transaction ID (dari struk Mandiri)</label>
      <input type="text" id="txId" inputmode="numeric" placeholder="opsional, tapi disarankan" autocomplete="off">
      <div class="hint">Dipakai untuk mencegah pencatatan ganda.</div>
    </div>

    <!-- Bayar Qmove -->
    <div class="blok" id="blokBayar">
      <label for="noPesanan">No Pesanan Qmove</label>
      <input type="text" id="noPesanan" inputmode="numeric" placeholder="contoh: 2410123456789012" autocomplete="off">

      <label for="nominalBayar">Total Biaya (Rp)</label>
      <input type="text" id="nominalBayar" inputmode="numeric" placeholder="50.000" autocomplete="off">
    </div>

    <label for="tanggal">Tanggal</label>
    <input type="date" id="tanggal">
    <div class="chips">
      <button type="button" class="chip" id="chipHariIni">Hari ini</button>
    </div>

    <label for="foto">Foto bukti (opsional)</label>
    <input type="file" id="foto" accept="image/*">
    <div class="hint">Foto akan dikecilkan otomatis sebelum dikirim.</div>

    <button class="submit" id="btnSubmit"></button>
    <div class="result" id="result"></div>
  </div>
</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxCmYiv4A6WsmeLK8PnFZ-_MjRDAgtAUTEWjkMO2NTtdyFr_fm-Sxox1LCzgHnMtkor/exec';

  const QS = new URLSearchParams(window.location.search);
  const CHAT_ID = QS.get('chatId') || '';
  const MODE = ['topup', 'lkab', 'bayar'].includes(QS.get('mode')) ? QS.get('mode') : 'topup';

  const NOMINAL_TOPUP = [20000, 150000, 500000, 1000000, 2000000];

  const CFG = {
    topup: {
      action: 'topup_qmove_app',
      title: '🚚 Top Up Saldo Qmove',
      btn: 'Catat Top Up',
      desc: '<b>Transfer:</b> BCA DKMS (110105) → Saldo Qmove (110257)'
    },
    lkab: {
      action: 'transfer_lkab_app',
      title: '🏧 Transfer LKAB → DKMS',
      btn: 'Catat Transfer LKAB',
      desc:
        '<b>Jurnal otomatis:</b><br>' +
        '• Transfer Bank: LKAB Mandiri → BCA DKMS (sesuai nominal)<br>' +
        '• Journal Voucher: Beban Adm Bank Rp2.500 dari LKAB Mandiri'
    },
    bayar: {
      action: 'bayar_qmove_app',
      title: '💳 Bayar Qmove',
      btn: 'Catat Pembayaran Qmove',
      desc:
        '<b>Jurnal otomatis:</b><br>' +
        '• Debit Beban Transportasi &amp; Operasional Kendaraan (6-200003)<br>' +
        '• Kredit Saldo Qmove (110257)<br>' +
        'Otomatis masuk Log Beban untuk Laba Rugi.'
    }
  };

  const el = {
    judul: document.getElementById('judul'),
    desc: document.getElementById('desc'),
    blokTopup: document.getElementById('blokTopup'),
    blokLkab: document.getElementById('blokLkab'),
    blokBayar: document.getElementById('blokBayar'),
    chipsNominal: document.getElementById('chipsNominal'),
    nominalLkab: document.getElementById('nominalLkab'),
    txId: document.getElementById('txId'),
    noPesanan: document.getElementById('noPesanan'),
    nominalBayar: document.getElementById('nominalBayar'),
    tanggal: document.getElementById('tanggal'),
    chipHariIni: document.getElementById('chipHariIni'),
    foto: document.getElementById('foto'),
    btn: document.getElementById('btnSubmit'),
    result: document.getElementById('result')
  };

  let selectedTopup = null;

  function todayJakarta() {
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date());
  }

  function rupiah(n) {
    return 'Rp ' + Number(n).toLocaleString('id-ID');
  }

  function angka(s) {
    return Number(String(s || '').replace(/\D/g, ''));
  }

  function getDicatatOleh() {
    try {
      const u = window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe
        && Telegram.WebApp.initDataUnsafe.user;
      if (u && u.first_name) return u.first_name;
    } catch (e) {}
    return 'Mini App';
  }

  function attachRupiah(input) {
    input.addEventListener('input', () => {
      const d = input.value.replace(/\D/g, '');
      input.value = d ? Number(d).toLocaleString('id-ID') : '';
    });
  }

  function renderChips() {
    el.chipsNominal.innerHTML = '';
    NOMINAL_TOPUP.forEach(n => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.textContent = rupiah(n);
      b.addEventListener('click', () => {
        selectedTopup = n;
        el.chipsNominal.querySelectorAll('.chip').forEach(c => c.classList.toggle('selected', c === b));
        hideResult();
      });
      el.chipsNominal.appendChild(b);
    });
  }

  function applyMode() {
    const cfg = CFG[MODE];
    el.judul.textContent = cfg.title;
    el.desc.innerHTML = cfg.desc;
    el.btn.textContent = cfg.btn;
    el.blokTopup.style.display = MODE === 'topup' ? 'block' : 'none';
    el.blokLkab.style.display = MODE === 'lkab' ? 'block' : 'none';
    el.blokBayar.style.display = MODE === 'bayar' ? 'block' : 'none';
  }

  function showResult(type, text) {
    el.result.className = 'result ' + type;
    el.result.textContent = text;
  }

  function hideResult() {
    el.result.className = 'result';
    el.result.textContent = '';
  }

  function setBusy(busy) {
    el.btn.disabled = busy;
    el.btn.textContent = busy ? 'Mengirim...' : CFG[MODE].btn;
  }

  // Kecilkan foto ke JPEG maks 1600px supaya payload tidak terlalu besar
  async function kompresFoto(file) {
    if (!file) return null;
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = reject;
      i.src = URL.createObjectURL(file);
    });
    const max = 1600;
    const scale = Math.min(1, max / Math.max(img.width, img.height));
    const w = Math.round(img.width * scale);
    const h = Math.round(img.height * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
    return { base64Image: dataUrl.split(',')[1], mimeType: 'image/jpeg' };
  }

  function buildPayload() {
    const payload = {
      action: CFG[MODE].action,
      chatId: CHAT_ID,
      tanggal: el.tanggal.value,
      dicatatOleh: getDicatatOleh()
    };

    if (MODE === 'topup') {
      if (!selectedTopup) throw new Error('Pilih nominal top up dulu.');
      payload.nominal = selectedTopup;
    } else if (MODE === 'lkab') {
      const nom = angka(el.nominalLkab.value);
      if (!nom || nom < 1000) throw new Error('Nominal transfer tidak valid (minimal Rp1.000).');
      payload.nominal = nom;
      payload.transactionId = el.txId.value.replace(/\D/g, '');
    } else {
      const no = el.noPesanan.value.replace(/\D/g, '');
      if (!no) throw new Error('No Pesanan wajib diisi.');
      const nom = angka(el.nominalBayar.value);
      if (!nom) throw new Error('Total Biaya wajib diisi.');
      payload.noPesanan = no;
      payload.nominal = nom;
    }

    return payload;
  }

  function resetForm() {
    if (MODE === 'topup') {
      selectedTopup = null;
      el.chipsNominal.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
    } else if (MODE === 'lkab') {
      el.nominalLkab.value = '';
      el.txId.value = '';
    } else {
      el.noPesanan.value = '';
      el.nominalBayar.value = '';
    }
    el.foto.value = '';
  }

  async function submit() {
    let payload;
    try {
      payload = buildPayload();
    } catch (err) {
      return showResult('err', err.message);
    }

    if (!payload.tanggal) return showResult('err', 'Tanggal wajib diisi.');
    if (!CHAT_ID) return showResult('err', 'chatId tidak ada. Buka mini app ini dari tombol di bot Telegram.');

    const ok = confirm(
      CFG[MODE].title + '\n' +
      'Tanggal: ' + payload.tanggal + '\n' +
      (payload.nominal ? 'Nominal: ' + rupiah(payload.nominal) + '\n' : '') +
      (payload.noPesanan ? 'No Pesanan: ' + payload.noPesanan + '\n' : '') +
      '\nLanjut catat?'
    );
    if (!ok) return;

    setBusy(true);
    hideResult();

    try {
      const file = el.foto.files[0];
      if (file) payload.foto = await kompresFoto(file);

      const res = await fetch(GAS_URL, {
        method: 'POST',
        // text/plain menghindari preflight CORS, sama seperti mini app lain
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (!data.success) {
        const prefix = data.duplikat ? '🔁 ' : '❌ ';
        showResult(data.duplikat ? 'warn' : 'err', prefix + (data.error || 'error tidak diketahui'));
      } else {
        showResult(data.bebanOk === false ? 'warn' : 'ok', data.pesan);
        resetForm();
      }
    } catch (err) {
      showResult('err',
        '❌ Koneksi ke server gagal: ' + err.message + '\n\n' +
        'Cek dulu di Accurate sebelum coba lagi, takutnya sudah ke-catat.'
      );
    } finally {
      setBusy(false);
    }
  }

  // ── Init ──
  attachRupiah(el.nominalLkab);
  attachRupiah(el.nominalBayar);
  renderChips();
  applyMode();
  el.tanggal.value = todayJakarta();
  el.chipHariIni.addEventListener('click', () => { el.tanggal.value = todayJakarta(); });
  el.btn.addEventListener('click', submit);
</script>
</body>
</html>
