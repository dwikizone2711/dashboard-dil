<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nota DIL - DKMS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1a1a1a; padding: 16px; padding-bottom: 40px; }
  h1 { font-size: 20px; margin-bottom: 4px; color: #1a3a5c; }
  .subtitle { font-size: 13px; color: #666; margin-bottom: 16px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 14px; color: #1a3a5c; margin-bottom: 12px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; margin-top: 12px; }
  label:first-child { margin-top: 0; }
  input { width: 100%; padding: 11px; border: 1px solid #d0d0d0; border-radius: 8px; font-size: 15px; }
  input:focus { outline: none; border-color: #1a3a5c; }
  input[type=file] { padding: 8px; font-size: 13px; }

  .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .item-card { background: #f7f9fb; border: 2px solid #e0e0e0; border-radius: 12px; padding: 14px 10px; text-align: center; cursor: pointer; }
  .item-card:active { border-color: #1a3a5c; background: #eaf1f8; }
  .item-card .icon { font-size: 26px; margin-bottom: 6px; }
  .item-card .nama { font-weight: 600; font-size: 13px; line-height: 1.3; }
  .item-card .satuan { font-size: 11px; color: #666; margin-top: 4px; }
  .empty-text { font-size: 13px; color: #888; }

  .item-row { border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-top: 12px; position: relative; }
  .item-row .nama-terpilih { font-weight: 600; font-size: 13px; margin-bottom: 8px; padding-right: 60px; }
  .item-row .row-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .item-row .hapus-item { position: absolute; top: 10px; right: 10px; color: #c0392b; font-size: 12px; cursor: pointer; }

  .total-row { display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; margin-top: 14px; padding-top: 10px; border-top: 1px solid #ddd; }
  button.submit-btn { width: 100%; margin-top: 6px; padding: 14px; background: #1a3a5c; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button.submit-btn:disabled { background: #a0a0a0; }
  .result { display: none; margin-top: 16px; padding: 14px; border-radius: 8px; font-size: 14px; line-height: 1.6; }
  .result.success { display: block; background: #e6f7ec; color: #1e7e34; }
  .result.error { display: block; background: #fdecea; color: #c0392b; }
</style>
</head>
<body>

  <h1>✍️ Nota DIL</h1>
  <div class="subtitle">Pembelian harian dari CV Dwikarya Inti Logam</div>

  <div class="card">
    <label>Tanggal</label>
    <input type="date" id="tanggal">

    <label>No. Nota (opsional)</label>
    <input type="text" id="nomorNota" placeholder="Kosongin kalau nggak ada">

    <label>Foto Nota (opsional)</label>
    <input type="file" id="fotoNota" accept="image/*" capture="environment">
  </div>

  <div class="card">
    <h2>Tap barang buat tambahin ke nota</h2>
    <div class="item-grid" id="itemCards">
      <div class="empty-text">Memuat daftar barang...</div>
    </div>
  </div>

  <div class="card" id="barangDipilihCard" style="display:none;">
    <h2>Barang di nota ini</h2>
    <div id="itemRows"></div>
    <div class="total-row"><span>Total</span><span id="totalDisplay">Rp 0</span></div>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="submitNota()">Simpan Nota DIL</button>

  <div class="result" id="result"></div>

<script>
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxCmYiv4A6WsmeLK8PnFZ-_MjRDAgtAUTEWjkMO2NTtdyFr_fm-Sxox1LCzgHnMtkor/exec';

  let rowCounter = 0;
  // id -> { skuDil, satuanDil, skuDkms, namaDkms, qtyPerSatuan, qtyDil, hargaSatuanDil }
  const rows = {};
  let semuaItemDil = [];

  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }
  const params = new URLSearchParams(window.location.search);
  const chatId = params.get('chatId') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? String(tg.initDataUnsafe.user.id) : '');
  const namaAdmin = params.get('nama') || ((tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? [tg.initDataUnsafe.user.first_name, tg.initDataUnsafe.user.last_name].filter(Boolean).join(' ') : 'Admin');

  document.getElementById('tanggal').valueAsDate = new Date();
  loadDaftarItemDil();

  function formatRp(n) { return 'Rp ' + Math.round(n).toLocaleString('id-ID'); }

  // ---------- Load daftar item DIL & render kartu ----------
  async function loadDaftarItemDil() {
    const el = document.getElementById('itemCards');
    try {
      const resp = await fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'daftar_item_dil_app' })
      });
      const json = await resp.json();
      semuaItemDil = (json.success && json.hasil) ? json.hasil : [];
      if (!semuaItemDil.length) {
        el.innerHTML = '<div class="empty-text">Belum ada barang di tab "Konversi Item DIL". Tambahin dulu di sheet-nya.</div>';
        return;
      }
      el.innerHTML = '';
      semuaItemDil.forEach(function (it) {
        const d = document.createElement('div');
        d.className = 'item-card';
        d.innerHTML =
          '<div class="icon">\u{1F4E6}</div>' +
          '<div class="nama">' + it.namaDkms + '</div>' +
          '<div class="satuan">' + it.skuDil + ' \u00b7 per ' + it.satuanDil + '</div>';
        d.onclick = function () { tambahBarisDariKartu(it); };
        el.appendChild(d);
      });
    } catch (err) {
      el.innerHTML = '<div class="empty-text">Gagal memuat daftar barang: ' + err.message + '</div>';
    }
  }

  // ---------- Baris barang terpilih ----------
  function tambahBarisDariKartu(it) {
    rowCounter++;
    const id = 'row' + rowCounter;
    rows[id] = {
      skuDil: it.skuDil, satuanDil: it.satuanDil, skuDkms: it.skuDkms,
      namaDkms: it.namaDkms, qtyPerSatuan: it.qtyPerSatuan,
      qtyDil: 1, hargaSatuanDil: 0
    };

    const div = document.createElement('div');
    div.className = 'item-row';
    div.id = 'itemrow-' + id;
    div.innerHTML =
      '<span class="hapus-item" onclick="hapusBaris(\'' + id + '\')">\u2715 Hapus</span>' +
      '<div class="nama-terpilih">' + it.skuDil + ' (' + it.satuanDil + ') \u2192 ' + it.namaDkms + '</div>' +
      '<div class="row-inputs">' +
        '<div><label style="margin-top:0;">Jumlah (' + it.satuanDil + ')</label><input type="number" value="1" oninput="updateQty(\'' + id + '\', this.value)"></div>' +
        '<div><label style="margin-top:0;">Harga per ' + it.satuanDil + '</label><input type="number" oninput="updateHarga(\'' + id + '\', this.value)"></div>' +
      '</div>';
    document.getElementById('itemRows').appendChild(div);
    document.getElementById('barangDipilihCard').style.display = 'block';
    hitungTotal();
    if (tg) tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light');
  }

  function hapusBaris(id) {
    delete rows[id];
    document.getElementById('itemrow-' + id).remove();
    if (Object.keys(rows).length === 0) document.getElementById('barangDipilihCard').style.display = 'none';
    hitungTotal();
  }

  function updateQty(id, v) { rows[id].qtyDil = parseFloat(v) || 0; hitungTotal(); }
  function updateHarga(id, v) { rows[id].hargaSatuanDil = parseFloat(v) || 0; hitungTotal(); }

  function hitungTotal() {
    let total = 0;
    Object.values(rows).forEach(function (it) { total += (it.qtyDil || 0) * (it.hargaSatuanDil || 0); });
    document.getElementById('totalDisplay').textContent = formatRp(total);
  }

  // ---------- File to base64 ----------
  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      if (!file) return resolve(null);
      const reader = new FileReader();
      reader.onload = function () { resolve({ base64: reader.result.split(',')[1], mimeType: file.type }); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ---------- Submit ----------
  async function submitNota() {
    const tanggal = document.getElementById('tanggal').value;
    if (!tanggal) return tampilkanHasil(false, 'Tanggal belum diisi.');

    const itemList = Object.values(rows).filter(function (it) { return it.skuDil && it.qtyDil > 0; });
    if (!itemList.length) return tampilkanHasil(false, 'Belum ada barang yang ditambahin.');

    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Menyimpan...';

    try {
      const fotoNota = await fileToBase64(document.getElementById('fotoNota').files[0]);
      const payload = {
        action: 'proses_nota_dil_app',
        tanggal: tanggal,
        nomorNota: document.getElementById('nomorNota').value || null,
        items: itemList.map(function (it) {
          return {
            skuDil: it.skuDil, satuanDil: it.satuanDil,
            skuDkms: it.skuDkms, qtyPerSatuan: it.qtyPerSatuan,
            qtyDil: it.qtyDil, hargaSatuanDil: it.hargaSatuanDil
          };
        }),
        dicatatOleh: namaAdmin,
        chatId: chatId
      };
      if (fotoNota) { payload.base64ImageNota = fotoNota.base64; payload.mimeTypeNota = fotoNota.mimeType; }

      const resp = await fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });
      const json = await resp.json();

      if (json.success) {
        let msg = '✅ Nota DIL tersimpan!<br>No. Faktur Pembelian (DKMS): ' + json.accurateNumberPI + '<br>Total: ' + formatRp(json.totalNilai) + '<br><br>';
        msg += 'Faktur Penjualan (DIL): ' + json.statusSIdil;
        if (json.warningSIdil) msg += '<br>⚠️ ' + json.warningSIdil;
        tampilkanHasil(true, msg);
        if (tg) tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
      } else {
        tampilkanHasil(false, json.error || 'Gagal simpan nota.');
      }
    } catch (err) {
      tampilkanHasil(false, 'Gagal terhubung ke server: ' + err.message);
    } finally {
      btn.disabled = false; btn.textContent = 'Simpan Nota DIL';
    }
  }

  function tampilkanHasil(sukses, html) {
    const el = document.getElementById('result');
    el.className = 'result ' + (sukses ? 'success' : 'error');
    el.innerHTML = html;
  }
</script>
</body>
</html>
