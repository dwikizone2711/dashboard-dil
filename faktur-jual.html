<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faktur Penjualan</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 16px 16px 90px; }
  h2 { font-size: 18px; margin-bottom: 12px; }
  label { font-size: 13px; color: #555; display: block; margin: 12px 0 4px; }
  input, select { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; }
  .dropdown { position: relative; margin-top: 6px; }
  .options { position: absolute; z-index: 10; background: #fff; width: 100%; max-height: 180px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; margin-top: 2px; }
  .options div { padding: 10px; border-bottom: 1px solid #f0f0f0; font-size: 13px; cursor: pointer; }
  .options div:hover { background: #f5f5f5; }

  .quick-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .chip { background: #eef2ff; color: #3949ab; border: none; border-radius: 20px; padding: 9px 14px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .chip:active { background: #dde2fa; }
  .chip-lain { background: #f0f0f0; color: #555; font-weight: normal; }

  .selected-tag { display: none; align-items: center; justify-content: space-between; background: #eef7ee; border: 1px solid #cfe8cf; border-radius: 8px; padding: 10px 12px; margin-top: 6px; font-size: 14px; }
  .selected-tag .nama { font-weight: 600; color: #1a7a3c; }
  .selected-tag .ganti { color: #3949ab; font-size: 13px; }

  .item-row { background: #fff; border-radius: 8px; padding: 10px; margin-top: 10px; }
  .item-row-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .item-row-header .item-title { font-size: 14px; font-weight: 600; color: #333; overflow-wrap: anywhere; }
  .item-row-header .hapus { flex-shrink: 0; color: #c00; font-size: 13px; font-weight: 600; padding: 4px 6px; white-space: nowrap; }
  .item-row .qty-harga { display: flex; gap: 8px; margin-top: 8px; }

  .tambah-item { margin-top: 10px; background: #eef2ff; color: #3949ab; border: none; padding: 10px; border-radius: 8px; width: 100%; font-size: 14px; }
  .submit-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px; background: #fff; box-shadow: 0 -2px 6px rgba(0,0,0,0.08); }
  .submit-bar button { width: 100%; background: #1a7a3c; color: #fff; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: 600; }
  .submit-bar button:disabled { background: #aaa; }
  .status { text-align: center; font-size: 13px; color: #888; margin-top: 6px; }
  .total { font-size: 14px; font-weight: 600; margin-top: 10px; text-align: right; }
</style>
</head>
<body>
<h2>🧾 Faktur Penjualan</h2>

<label>Customer</label>
<div class="quick-chips" id="customerChips">
  <!-- diisi otomatis oleh JS dari CUSTOMER_CEPAT -->
</div>
<div class="dropdown" id="customerSearchWrap" style="display:none">
  <input id="customerInput" placeholder="Ketik nama customer...">
  <div class="options" id="customerOptions"></div>
</div>
<div class="selected-tag" id="customerSelectedTag">
  <span class="nama" id="customerSelectedNama"></span>
  <span class="ganti" onclick="gantiCustomer()">Ganti</span>
</div>
<input type="hidden" id="customerNo">

<label>Tanggal</label>
<input type="date" id="tanggal">

<div id="itemList"></div>
<button class="tambah-item" onclick="tambahItemRow()">+ Tambah Barang</button>

<div class="total" id="totalNilai"></div>

<div class="submit-bar">
  <button id="btnSubmit" onclick="submitFaktur()">Simpan Faktur Penjualan</button>
  <div class="status" id="status"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
const initData = tg.initDataUnsafe || {};

// Ambil chatId dari URL param dulu (?chatId=123456) -- ini lebih stabil
// daripada initDataUnsafe.user.id, yang suka kosong kalau mini app dibuka
// dari Telegram Web (web.telegram.org). Fallback ke initDataUnsafe kalau
// URL param-nya gak ada.
const urlParams = new URLSearchParams(window.location.search);
const chatIdDariUrl = urlParams.get('chatId');
const chatId = chatIdDariUrl || (initData.user ? initData.user.id : null);

// Customer yang paling sering dipakai — kode Accurate sudah pasti, jadi
// langsung dipilih tanpa fetch ke server (lebih cepat & gak gampang gagal).
const CUSTOMER_CEPAT = [
  { label: 'Ibrahim', kode: 'C.00032', nama: 'IBRAHIM GROUP' },
  { label: 'Jessen', kode: 'C.00030', nama: 'JESSEN' },
  { label: 'Mangungsong', kode: 'C.00059', nama: 'MANGUNGSONG' }
];

const GAS_URL = 'https://script.google.com/macros/s/AKfycbxCmYiv4A6WsmeLK8PnFZ-_MjRDAgtAUTEWjkMO2NTtdyFr_fm-Sxox1LCzgHnMtkor/exec';
let customerNamaTerpilih = '';
let items = [];

// Barang yang paling sering dipakai — tampil sebagai tombol cepat di tiap baris item.
// SKU & nama sudah pasti, jadi langsung dipilih tanpa fetch ke server (lebih cepat & gak gampang gagal).
const ITEM_CEPAT = [
  { label: 'GHKS-500PCS', sku: 'GHKS-500PCS', nama: 'GHKS-500PCS' },
  { label: 'TMA-002', sku: 'TMA-002', nama: 'TMA-002' }
];

document.getElementById('tanggal').valueAsDate = new Date();

// ================= CUSTOMER =================

function renderCustomerChips() {
  const box = document.getElementById('customerChips');
  const chipsHtml = CUSTOMER_CEPAT.map(c =>
    '<button type="button" class="chip" onclick="pilihCustomerCepat(\'' + c.kode + '\')">' + c.label + '</button>'
  ).join('');
  box.innerHTML = chipsHtml + '<button type="button" class="chip chip-lain" onclick="focusCustomerSearch()">Lainnya...</button>';
}
renderCustomerChips();

function pilihCustomerCepat(kode) {
  const c = CUSTOMER_CEPAT.find(x => x.kode === kode);
  if (!c) return;
  pilihCustomer({ kodeCustomer: c.kode, namaCustomer: c.nama });
}

function pilihCustomer(c) {
  document.getElementById('customerNo').value = c.kodeCustomer;
  customerNamaTerpilih = c.namaCustomer;
  document.getElementById('customerChips').style.display = 'none';
  document.getElementById('customerSearchWrap').style.display = 'none';
  document.getElementById('customerOptions').innerHTML = '';
  document.getElementById('customerInput').value = '';
  document.getElementById('customerSelectedNama').textContent = c.namaCustomer;
  document.getElementById('customerSelectedTag').style.display = 'flex';
}

function gantiCustomer() {
  document.getElementById('customerNo').value = '';
  customerNamaTerpilih = '';
  document.getElementById('customerSelectedTag').style.display = 'none';
  document.getElementById('customerChips').style.display = 'flex';
}

function focusCustomerSearch() {
  document.getElementById('customerSearchWrap').style.display = 'block';
  document.getElementById('customerInput').focus();
}

let customerTimeout;
document.getElementById('customerInput').addEventListener('input', function () {
  clearTimeout(customerTimeout);
  const q = this.value;
  const box = document.getElementById('customerOptions');
  if (q.length < 2) { box.innerHTML = ''; return; }
  customerTimeout = setTimeout(() => {
    fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'cari_customer_faktur_jual', query: q }) })
      .then(r => r.json())
      .then(data => {
        box.innerHTML = '';
        (data.hasil || []).forEach(c => {
          const div = document.createElement('div');
          div.textContent = c.namaCustomer + (c.skor < 100 ? ' (' + c.skor + '%)' : '');
          div.onclick = () => pilihCustomer(c);
          box.appendChild(div);
        });
      });
  }, 300);
});

// ================= ITEM =================

function tambahItemRow() {
  const idx = items.length;
  items.push({ namaBarang: '', namaTampil: '', qty: 1, hargaSatuan: 0 });
  const row = document.createElement('div');
  row.className = 'item-row';
  row.id = 'item-' + idx;

  const chipsHtml = ITEM_CEPAT.map(it =>
    '<button type="button" class="chip" onclick="pilihItemCepat(' + idx + ', \'' + it.sku + '\')">' + it.label + '</button>'
  ).join('');

  row.innerHTML = `
    <div class="item-row-header">
      <span class="item-title" id="itemTitle-${idx}">Barang #${idx + 1}</span>
      <span class="hapus" onclick="hapusItem(${idx})">✕ Hapus</span>
    </div>
    <div class="quick-chips" id="itemChips-${idx}">
      ${chipsHtml}
      <button type="button" class="chip chip-lain" onclick="focusItemSearch(${idx})">Lainnya...</button>
    </div>
    <div class="dropdown" id="itemSearchWrap-${idx}" style="display:none">
      <input placeholder="Cari barang..." oninput="cariItemInput(${idx}, this.value)">
      <div class="options" id="itemOptions-${idx}"></div>
    </div>
    <div class="qty-harga">
      <input type="number" placeholder="Qty" min="1" value="1" oninput="items[${idx}].qty = Number(this.value); hitungTotal();">
      <input type="number" placeholder="Harga satuan" oninput="items[${idx}].hargaSatuan = Number(this.value); hitungTotal();">
    </div>
  `;
  document.getElementById('itemList').appendChild(row);
}

function pilihItemCepat(idx, sku) {
  const it = ITEM_CEPAT.find(x => x.sku === sku);
  if (!it) return;
  pilihItemUntukRow(idx, { sku: it.sku, nama: it.nama });
}

function pilihItemUntukRow(idx, it) {
  items[idx].namaBarang = it.sku;
  items[idx].namaTampil = it.nama;
  document.getElementById('itemTitle-' + idx).textContent = it.nama;
  document.getElementById('itemChips-' + idx).style.display = 'none';
  document.getElementById('itemSearchWrap-' + idx).style.display = 'none';
}

function focusItemSearch(idx) {
  document.getElementById('itemChips-' + idx).style.display = 'none';
  const wrap = document.getElementById('itemSearchWrap-' + idx);
  wrap.style.display = 'block';
  wrap.querySelector('input').focus();
}

let itemTimeout;
function cariItemInput(idx, q) {
  clearTimeout(itemTimeout);
  const box = document.getElementById('itemOptions-' + idx);
  if (q.length < 2) { box.innerHTML = ''; return; }
  itemTimeout = setTimeout(() => {
    fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'cari_item_faktur_jual', query: q }) })
      .then(r => r.json())
      .then(data => {
        box.innerHTML = '';
        (data.hasil || []).forEach(it => {
          const div = document.createElement('div');
          div.textContent = '[' + it.sku + '] ' + it.nama;
          div.onclick = () => pilihItemUntukRow(idx, it);
          box.appendChild(div);
        });
      });
  }, 300);
}

function hapusItem(idx) {
  items[idx] = null;
  const row = document.getElementById('item-' + idx);
  if (row) row.remove();
  hitungTotal();
}

function hitungTotal() {
  const total = items.filter(Boolean).reduce((t, it) => t + (it.qty * it.hargaSatuan), 0);
  document.getElementById('totalNilai').textContent = 'Total: Rp ' + Math.round(total).toLocaleString('id-ID');
}

// ================= SUBMIT =================

function submitFaktur() {
  const customerNo = document.getElementById('customerNo').value;
  const tanggal = document.getElementById('tanggal').value;
  const itemsFinal = items.filter(it => it && it.namaBarang && it.qty > 0);

  if (!customerNo) return setStatus('Pilih customer dulu.');
  if (itemsFinal.length === 0) return setStatus('Isi minimal 1 barang.');

  document.getElementById('btnSubmit').disabled = true;
  setStatus('Menyimpan...');

  fetch(GAS_URL, {
    method: 'POST', headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({
      action: 'submit_faktur_jual', customerNo: customerNo, namaCustomer: customerNamaTerpilih,
      tanggal: tanggal, items: itemsFinal, chatId: chatId
    })
  })
  .then(r => r.json())
  .then(data => {
    if (data.success) {
      setStatus('✅ Faktur ' + data.accurateNumber + ' berhasil dibuat!');
      tg.close();
    } else {
      setStatus('❌ ' + data.error);
      document.getElementById('btnSubmit').disabled = false;
    }
  })
  .catch(err => { setStatus('Error: ' + err.message); document.getElementById('btnSubmit').disabled = false; });
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

tambahItemRow();
</script>
</body>
</html>
