<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jual Roll Kawat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#0f1115; --card:#1c1f26; --text:#f1f1f1; --hint:#8a8f98; --button:#2ea6ff; --border:rgba(255,255,255,0.08); --green:#34c759; --red:#ff5b5b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; padding:16px 16px 32px; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:15px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--hint); font-size:13px; margin-bottom:14px; }
  .stok { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:16px; font-size:14px; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:12px; font-weight:700; color:var(--hint); text-transform:uppercase; letter-spacing:.3px; margin-bottom:6px; }
  input { width:100%; padding:12px 14px; border-radius:10px; background:var(--card); border:1.5px solid var(--border); color:var(--text); font-size:16px; font-family:inherit; }
  input:focus { outline:none; border-color:var(--button); }
  .ringkas { display:flex; justify-content:space-between; background:var(--card); border-radius:12px; padding:12px 14px; margin:6px 0 16px; }
  .ringkas b { color:var(--button); }
  button { width:100%; padding:14px; border:0; border-radius:12px; background:var(--button); color:#fff; font-size:16px; font-weight:700; }
  button:disabled { opacity:.4; }
  #msg { margin-top:14px; font-size:14px; min-height:20px; white-space:pre-line; }
  #msg.err { color:var(--red); }
  #msg.ok { color:var(--green); }
</style>
</head>
<body>
  <h1>Jual Roll Kawat BWG16</h1>
  <div class="sub">DIL → DKMS · 1 roll = 49,5 kg</div>

  <div class="stok" id="stok">Memuat sisa stok…</div>

  <div class="field">
    <label>Tanggal</label>
    <input type="date" id="tgl">
  </div>
  <div class="field">
    <label>Jumlah roll</label>
    <input type="number" id="roll" min="1" step="1" inputmode="numeric">
  </div>
  <div class="field">
    <label>Harga per roll (Rp)</label>
    <input type="number" id="harga" value="710000" min="1" step="1000" inputmode="numeric">
  </div>
  <div class="field">
    <label>Catatan (opsional)</label>
    <input type="text" id="catatan">
  </div>

  <div class="ringkas">
    <span>Berat: <b id="kg">0.0</b> kg</span>
    <span>Total: <b id="total">Rp0</b></span>
  </div>

  <button id="btn" disabled>Simpan & Buat Faktur</button>
  <div id="msg"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycby2wyVacT1kFqYt5481dypHMCp5T_Eg_KertLLWXNE0yu3YqKg4RiDNiqKWPlwGvhCxqw/exec';
const KG_PER_ROLL = 49.5;

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const chatId = new URLSearchParams(location.search).get('chatId') || '';

const $ = id => document.getElementById(id);
let sisaKg = null;

function rp(n) { return 'Rp' + Math.round(n).toLocaleString('id-ID'); }

async function callGas(action, data) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, data })
  });
  const text = await res.text();
  try { return JSON.parse(text); }
  catch (e) { throw new Error('Respons server tidak valid. Jangan kirim ulang dulu, cek sheet Log Jual Roll.'); }
}

async function muatSisa() {
  if (!chatId) {
    $('stok').textContent = 'Buka dari tombol di Telegram.';
    hitung();
    return;
  }
  try {
    const r = await callGas('cek_stok_roll_dil', { chatId });
    if (!r.success) throw new Error(r.error || 'Gagal');
    sisaKg = r.sisaKg;
    $('stok').textContent = `Sisa stok: ${r.sisaRoll} roll penuh (${sisaKg.toFixed(1)} kg)`;
  } catch (e) {
    $('stok').textContent = 'Sisa stok tidak terbaca: ' + e.message;
  }
  hitung();
}

function hitung() {
  const roll = parseInt($('roll').value, 10);
  const harga = parseFloat($('harga').value);
  const valid = roll >= 1 && harga > 0;
  const kg = valid ? roll * KG_PER_ROLL : 0;
  $('kg').textContent = kg.toFixed(1);
  $('total').textContent = valid ? rp(roll * harga) : 'Rp0';

  let err = '';
  if (!chatId) err = 'Buka dari tombol di Telegram.';
  else if (valid && sisaKg !== null && kg > sisaKg) {
    err = `Stok kurang. Maksimal ${Math.floor(sisaKg / KG_PER_ROLL)} roll.`;
  }
  $('msg').textContent = err;
  $('msg').className = err ? 'err' : '';
  $('btn').disabled = !valid || !!err || !chatId;
}

async function kirim() {
  const btn = $('btn');
  const roll = parseInt($('roll').value, 10);
  btn.disabled = true;
  btn.textContent = 'Menyimpan…';
  $('msg').textContent = '';
  $('msg').className = '';

  try {
    const r = await callGas('jual_roll_dil', {
      chatId,
      idKey: 'JR-' + chatId + '-' + Date.now(),
      tanggal: $('tgl').value,
      jumlahRoll: roll,
      hargaPerRoll: parseFloat($('harga').value),
      catatan: $('catatan').value.trim()
    });
    if (!r.success) throw new Error(r.error || 'Gagal menyimpan');

    $('msg').className = 'ok';
    $('msg').textContent = 'Berhasil disimpan.'
      + (r.noFakturDil ? '\nFaktur DIL: ' + r.noFakturDil : '')
      + (r.noFakturDkms ? '\nFaktur DKMS: ' + r.noFakturDkms : '');
    btn.textContent = 'Tersimpan';
    if (tg) setTimeout(() => tg.close(), 2500);
  } catch (e) {
    $('msg').className = 'err';
    $('msg').textContent = e.message;
    btn.textContent = 'Simpan & Buat Faktur';
    hitung();
  }
}

$('tgl').value = new Date().toLocaleDateString('sv-SE');
['roll', 'harga'].forEach(id => $(id).addEventListener('input', hitung));
$('btn').addEventListener('click', kirim);
muatSisa();
</script>
</body>
</html>
