<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Konfirmasi Tanggal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e8eaf0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px 16px;
    }

    .card {
      background: #1a1d2e;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      border: 1px solid #2a2d3e;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .header-icon {
      font-size: 28px;
    }

    .header-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
    }

    .header-sub {
      font-size: 12px;
      color: #8b8fa8;
      margin-top: 2px;
    }

    .divider {
      height: 1px;
      background: #2a2d3e;
      margin: 16px 0;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .info-label {
      font-size: 13px;
      color: #8b8fa8;
    }

    .info-value {
      font-size: 14px;
      font-weight: 600;
      color: #e8eaf0;
      text-align: right;
    }

    .info-value.highlight {
      color: #4ade80;
      font-size: 16px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #8b8fa8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      margin-top: 20px;
    }

    .field-group {
      margin-bottom: 16px;
    }

    .field-label {
      font-size: 13px;
      color: #8b8fa8;
      margin-bottom: 6px;
      display: block;
    }

    .field-input {
      width: 100%;
      background: #0f1117;
      border: 1px solid #3a3d4e;
      border-radius: 10px;
      padding: 12px 14px;
      color: #e8eaf0;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }

    .field-input:focus {
      border-color: #6366f1;
    }

    .field-hint {
      font-size: 11px;
      color: #6b6f82;
      margin-top: 5px;
    }

    .alert {
      background: #1e2238;
      border: 1px solid #3a3d4e;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #8b8fa8;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .alert.warn {
      border-color: #f59e0b44;
      background: #1e1a10;
      color: #fbbf24;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .btn:active { transform: scale(0.98); opacity: 0.85; }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 12px;
      display: none;
    }

    .status.loading {
      display: block;
      background: #1e2238;
      color: #8b8fa8;
    }

    .status.success {
      display: block;
      background: #0f2318;
      color: #4ade80;
    }

    .status.error {
      display: block;
      background: #2a1010;
      color: #f87171;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #3a3d4e;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="header-icon" id="headerIcon">📋</div>
    <div>
      <div class="header-title" id="headerTitle">Konfirmasi Transaksi</div>
      <div class="header-sub" id="headerSub">Verifikasi tanggal sebelum disimpan</div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Info ringkasan transaksi -->
  <div id="infoSection">
    <div class="info-row" id="rowDari" style="display:none">
      <span class="info-label">Dari</span>
      <span class="info-value" id="valDari">-</span>
    </div>
    <div class="info-row" id="rowKe" style="display:none">
      <span class="info-label">Ke</span>
      <span class="info-value" id="valKe">-</span>
    </div>
    <div class="info-row" id="rowNominal" style="display:none">
      <span class="info-label">Nominal</span>
      <span class="info-value highlight" id="valNominal">-</span>
    </div>
    <div class="info-row" id="rowBiayaAdmin" style="display:none">
      <span class="info-label">Biaya Admin</span>
      <span class="info-value" id="valBiayaAdmin">-</span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="alert warn" id="ocrWarnBox" style="display:none">
    ⚠️ OCR tidak bisa baca tanggal dari foto. Isi tanggal transaksi di bawah sebelum disimpan.
  </div>

  <div class="section-title">Tanggal Transaksi</div>

  <div class="field-group">
    <label class="field-label" for="inputTanggal">Tanggal</label>
    <input type="date" id="inputTanggal" class="field-input">
    <div class="field-hint">Sesuaikan dengan tanggal yang tertera di bukti transfer</div>
  </div>

  <button class="btn btn-primary" id="btnSubmit" onclick="submitKonfirmasi()">
    ✅ Simpan & Push ke Accurate
  </button>

  <div class="status" id="statusBox"></div>
</div>

<script>
// ── Ambil parameter dari URL ──────────────────────────────────
const params = new URLSearchParams(window.location.search);
const token   = params.get('token')   || '';
const tipe    = params.get('tipe')    || '';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxCmYiv4A6WsmeLK8PnFZ-_MjRDAgtAUTEWjkMO2NTtdyFr_fm-Sxox1LCzgHnMtkor/exec';

// ── Tampilan per tipe transaksi ───────────────────────────────
const CONFIG = {
  topup_qmove: {
    icon: '🚚',
    title: 'Top Up Saldo Qmove',
    sub: 'Konfirmasi tanggal top up'
  },
  transfer_lkab: {
    icon: '🏧',
    title: 'Transfer LKAB → DKMS',
    sub: 'Konfirmasi tanggal transfer'
  }
};

// ── Set default tanggal ke hari ini (WIB) ─────────────────────
function todayWIB() {
  const now = new Date();
  const wib = new Date(now.getTime() + (7 * 60 * 60 * 1000));
  return wib.toISOString().split('T')[0];
}

// ── Inisialisasi halaman ──────────────────────────────────────
async function init() {
  // Default tanggal input = hari ini
  document.getElementById('inputTanggal').value = todayWIB();

  if (!token) {
    showStatus('error', '❌ Token tidak ditemukan. Buka link ini dari Telegram.');
    document.getElementById('btnSubmit').disabled = true;
    return;
  }

  // Fetch data pending dari GAS
  try {
    const res = await fetch(GAS_URL + '?action=ambil_pending_konfirmasi_tanggal&token=' + encodeURIComponent(token));
    const data = await res.json();

    if (!data.success) {
      showStatus('error', '❌ ' + (data.error || 'Data tidak ditemukan. Mungkin sudah diproses sebelumnya.'));
      document.getElementById('btnSubmit').disabled = true;
      return;
    }

    // Terapkan config tampilan
    const cfg = CONFIG[data.tipe] || CONFIG['topup_qmove'];
    document.getElementById('headerIcon').textContent = cfg.icon;
    document.getElementById('headerTitle').textContent = cfg.title;
    document.getElementById('headerSub').textContent = cfg.sub;

    const d = data.dataJson || {};

    // Tampilkan info sesuai data
    if (d.dari) {
      document.getElementById('valDari').textContent = d.dari;
      document.getElementById('rowDari').style.display = 'flex';
    }
    if (d.ke) {
      document.getElementById('valKe').textContent = d.ke;
      document.getElementById('rowKe').style.display = 'flex';
    }
    if (d.nominal) {
      document.getElementById('valNominal').textContent = 'Rp ' + Number(d.nominal).toLocaleString('id-ID');
      document.getElementById('rowNominal').style.display = 'flex';
    }
    if (d.biayaAdmin) {
      document.getElementById('valBiayaAdmin').textContent = 'Rp ' + Number(d.biayaAdmin).toLocaleString('id-ID');
      document.getElementById('rowBiayaAdmin').style.display = 'flex';
    }

    // Kalau OCR gagal baca tanggal, tampilkan warning
    if (data.ocrGagalTanggal) {
      document.getElementById('ocrWarnBox').style.display = 'block';
    }

    // Kalau OCR berhasil baca tanggal, pre-fill
    if (d.tanggalOcr && d.tanggalOcr !== '') {
      document.getElementById('inputTanggal').value = d.tanggalOcr;
    }

  } catch (e) {
    showStatus('error', '❌ Gagal memuat data: ' + e.message);
    document.getElementById('btnSubmit').disabled = true;
  }
}

// ── Submit ────────────────────────────────────────────────────
async function submitKonfirmasi() {
  const tanggal = document.getElementById('inputTanggal').value;
  if (!tanggal) {
    showStatus('error', '❌ Pilih tanggal dulu.');
    return;
  }

  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  showStatus('loading', '<span class="spinner"></span>Menyimpan ke Accurate...');

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'konfirmasi_tanggal_transaksi',
        token: token,
        tanggal: tanggal
      })
    });
    const data = await res.json();

    if (data.success) {
      showStatus('success', '✅ ' + (data.reply || 'Berhasil disimpan ke Accurate!'));
      btn.style.display = 'none';
    } else {
      showStatus('error', '❌ ' + (data.error || 'Gagal simpan ke Accurate.'));
      btn.disabled = false;
    }
  } catch (e) {
    showStatus('error', '❌ Error: ' + e.message);
    btn.disabled = false;
  }
}

function showStatus(type, html) {
  const box = document.getElementById('statusBox');
  box.className = 'status ' + type;
  box.innerHTML = html;
}

init();
</script>
</body>
</html>
